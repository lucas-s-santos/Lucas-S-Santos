name: Atualizar estatísticas

on:
  schedule:
    - cron: "0 6 * * *" # todo dia, 03h no horário de Brasília
  workflow_dispatch:
  push:
    paths: ["scripts/stats.mjs"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/stats.mjs
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || (git commit -m "chore: atualiza estatísticas" && git push)
